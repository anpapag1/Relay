image: atlassian/default-image:3

pipelines:
  branches:
    main:
      - step:
          name: Build and push image
          services:
            - docker
          script:
            - docker build --pull -t "$DOCKER_HUB_USERNAME/$BITBUCKET_REPO_SLUG:latest" .
            - docker tag "$DOCKER_HUB_USERNAME/$BITBUCKET_REPO_SLUG:latest" "$DOCKER_HUB_USERNAME/$BITBUCKET_REPO_SLUG:$BITBUCKET_COMMIT"
            - docker login --username "$DOCKER_HUB_USERNAME" --password "$DOCKER_HUB_PASSWORD"
            - docker push "$DOCKER_HUB_USERNAME/$BITBUCKET_REPO_SLUG:latest"
            - docker push "$DOCKER_HUB_USERNAME/$BITBUCKET_REPO_SLUG:$BITBUCKET_COMMIT"